version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DEMO_MODE=true
      - SECRET_KEY=demo-secret-change-in-production

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
